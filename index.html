<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Question for You...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
      --primary-color: #ff4d6d;
      --secondary-color: #fff0f3;
      --text-color: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.2);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Great Vibes', cursive;
      background: var(--bg-color);
      background-size: 400% 400%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      text-shadow: 2px 2px 8px var(--shadow-color);
      animation: gradientBG 15s ease infinite;
    }
    h1 {
      font-size: 5rem;
      margin-bottom: 3rem;
      animation: fadeInGlow 2.5s ease-out infinite alternate;
    }
    #yes-button, #no-button {
      padding: 1rem 2.5rem;
      font-size: 1.5rem;
      font-family: sans-serif;
      font-weight: bold;
      border: none;
      border-radius: 5rem;
      cursor: pointer;
      box-shadow: 0 6px 15px var(--shadow-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: absolute;
      z-index: 2;
    }
    #yes-button {
      background-color: var(--primary-color);
      color: var(--text-color);
      left: 35%;
      top: 60%;
      animation: pulse 1.5s infinite;
    }
    #yes-button:hover {
      transform: scale(1.15);
      box-shadow: 0 8px 20px var(--shadow-color);
    }
    #no-button {
      background-color: var(--secondary-color);
      color: var(--primary-color);
      left: 65%;
      top: 60%;
      /* The transition for smooth movement is now on the button itself */
      transition: all 0.2s ease-in-out;
    }
    .heart {
      position: fixed;
      font-size: 2rem;
      color: var(--primary-color);
      animation: floatUp 4s ease-in forwards;
      opacity: 0.8;
      pointer-events: none;
    }
    #celebration {
        display: none;
        text-align: center;
        animation: fadeIn 2s ease-out;
    }
    #mute-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.5);
        border: none;
        color: #333;
        padding: 10px;
        border-radius: 50%;
        cursor: pointer;
        z-index: 10;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeInGlow {
      from {
        opacity: 0.7;
        text-shadow: 2px 2px 8px var(--shadow-color);
      }
      to {
        opacity: 1;
        text-shadow: 3px 3px 15px var(--primary-color);
      }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    @keyframes floatUp {
      to {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }
     @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="question">
    <h1>Do You Love Me?</h1>
    <button id="yes-button">YES</button>
    <button id="no-button">NO</button>
  </div>

  <div id="celebration">
      <h1>Of course, you do!</h1>
      <p style="font-size:2rem; font-family: sans-serif;">I love you more! ❤️</p>
  </div>
  
  <audio id="romantic-music" loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
  </audio>

  <button id="mute-button">🔇</button>

  <script>
    const noBtn = document.getElementById('no-button');
    const yesBtn = document.getElementById('yes-button');
    const questionDiv = document.getElementById('question');
    const celebrationDiv = document.getElementById('celebration');
    const music = document.getElementById('romantic-music');
    const muteBtn = document.getElementById('mute-button');
    let isMuted = false;

    const dangerZone = 120; // The radius around the button that triggers movement

    // --- Music Controls ---
    function playMusic() {
        if (!isMuted) {
            music.play().catch(error => {
                console.log("Waiting for user interaction to play music.");
            });
        }
    }
    document.body.addEventListener('click', playMusic, { once: true });
    
    muteBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        music.muted = isMuted;
        muteBtn.textContent = isMuted ? '🎵' : '🔇';
    });


    // --- "No" Button Shenanigans (CORRECTED) ---
    document.addEventListener('mousemove', e => {
      // Get the bounding box of the button
      const rect = noBtn.getBoundingClientRect();
      // Calculate the center of the button
      const btnX = rect.left + rect.width / 2;
      const btnY = rect.top  + rect.height / 2;
      // Get the cursor position
      const cursorX = e.clientX;
      const cursorY = e.clientY;
      // Calculate the distance between cursor and button center
      const distX = cursorX - btnX;
      const distY = cursorY - btnY;
      const distance = Math.sqrt(distX * distX + distY * distY);

      // If the cursor is inside the danger zone, move the button
      if (distance < dangerZone) {
        const maxX = window.innerWidth  - rect.width;
        const maxY = window.innerHeight - rect.height;
        
        const newX = Math.random() * maxX;
        const newY = Math.random() * maxY;
        
        noBtn.style.left = newX + 'px';
        noBtn.style.top  = newY + 'px';
      }
    });

    // --- "Yes" Button Celebration ---
    yesBtn.addEventListener('click', () => {
      questionDiv.style.display = 'none';
      celebrationDiv.style.display = 'block';
      setInterval(createHeart, 100);
      playMusic(); // Ensure music plays if it hasn't started
    });

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '&#10084;';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
  </script>

</body>
</html>
